# FasterEdge 开源项目 - Github: https://github.com/FasterEdge - Gitee: https://gitee.com/FasterEdge
# Any2Pcd 独立仓库 CI: go build/vet/test。
name: 'Go 检查(build/vet/test)'

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: 'go build'
        run: go build ./...
      - name: 'go vet'
        run: go vet ./...
      - name: 'go test'
        run: go test ./...